name: Build Android app

# The app is a thin Android shell that loads the live site (www/ on GitHub Pages), so a new APK is needed
# only when the shell changes. Run it by hand from the Actions tab any time.
on:
  push:
    branches: [main]
    paths: ['package.json', 'capacitor.config.json', 'shell/**', 'assets/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 24.04 ships with the Android SDK preinstalled (ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --splashBackgroundColor '#0a84ff' --splashBackgroundColorDark '#000000' || echo "::warning::icon generation failed, using the default icon"
          npx cap sync android

      # Real Android permissions: these are what Settings > Apps > Friends > Permissions lists.
      # The friends://auth link brings Google sign-in back from Chrome.
      - name: Permissions and sign-in link
        run: |
          node -e "
          const fs = require('fs'), f = 'android/app/src/main/AndroidManifest.xml';
          let s = fs.readFileSync(f, 'utf8');
          const perms = ['RECORD_AUDIO', 'CAMERA', 'MODIFY_AUDIO_SETTINGS', 'POST_NOTIFICATIONS', 'ACCESS_NETWORK_STATE']
            .map(p => '    <uses-permission android:name=\"android.permission.' + p + '\" />').join('\n');
          s = s.replace('</manifest>', perms + '\n    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />\n    <uses-feature android:name=\"android.hardware.microphone\" android:required=\"false\" />\n</manifest>');
          const link = '\n            <intent-filter>\n                <action android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"android.intent.category.DEFAULT\" />\n                <category android:name=\"android.intent.category.BROWSABLE\" />\n                <data android:scheme=\"friends\" android:host=\"auth\" />\n            </intent-filter>';
          s = s.replace('</intent-filter>', '</intent-filter>' + link);
          fs.writeFileSync(f, s);
          "
          grep -c "RECORD_AUDIO\|android:scheme=\"friends\"" android/app/src/main/AndroidManifest.xml
          # each build gets a higher version number so phones accept it as an update
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      # Signed with a fixed key when the FRIENDS_SIGNING secret exists ("<password>:<base64 of the .p12>"),
      # so new builds install over the old app. Without it, a debug build (uninstall before updating).
      - name: Build APK
        working-directory: android
        env:
          SIGNING: ${{ secrets.FRIENDS_SIGNING }}
        run: |
          chmod +x gradlew
          if [ -n "$SIGNING" ]; then
            PASS="${SIGNING%%:*}"
            printf '%s' "${SIGNING#*:}" | base64 -d > "$RUNNER_TEMP/friends.p12"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/friends.p12" \
              -Pandroid.injected.signing.store.password="$PASS" \
              -Pandroid.injected.signing.key.alias=friends \
              -Pandroid.injected.signing.key.password="$PASS"
            cp app/build/outputs/apk/release/app-release.apk ../friends.apk
          else
            echo "::warning::No FRIENDS_SIGNING secret: building a debug-signed APK"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../friends.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: friends-apk
          path: friends.apk

      - name: Publish release (download straight to the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Friends לאנדרואיד ${{ github.run_number }}
          make_latest: true
          body: |
            הורדה והתקנה בטלפון: לחצו על friends.apk, ואז "התקנה".
            אם הטלפון שואל, אשרו "התקנה ממקורות לא ידועים" עבור Chrome.
          files: friends.apk
